name: Build and publish add-on image

on:
  push:
    branches: [main]
    paths:
      - "dragonwilds/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dragonwilds

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from config.yaml
        id: meta
        run: |
          version=$(sed -n 's/^version: *"\?\([^"]*\)"\?$/\1/p' dragonwilds/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: dragonwilds
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.arch=amd64
            io.hass.type=app
            io.hass.name=RuneScape Dragonwilds Server
            io.hass.description=Dedicated RuneScape Dragonwilds server for up to 6 players
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

name: RuneScape Dragonwilds Server
version: "1.0.3"
slug: dragonwilds
description: Dedicated RuneScape Dragonwilds server for up to 6 players
url: https://github.com/Yskaa91/runescape_dragonwilds_ha_server/tree/main/dragonwilds
arch:
  - amd64
image: "ghcr.io/yskaa91/dragonwilds"
startup: application
boot: auto
init: false
host_network: true
ports:
  7777/udp: 7777
  8888/udp: 8888
ports_description:
  7777/udp: Game port
  8888/udp: Beacon port (game port + 1111)
map:
  - type: app_config
    read_only: false
options:
  owner_id: ""
  server_name: Dragonwilds
  world_name: DefaultWorld
  password: ""
  admin_password: ""
  admins: ""
  additional_args: ""
  auto_stop_on_update: false
  validate_files: false
schema:
  owner_id: str
  server_name: str
  world_name: str
  password: password
  admin_password: password
  admins: str
  additional_args: str
  auto_stop_on_update: bool
  validate_files: bool
